#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[user]
name = "icrayix"
email = "icrayix@gmail.com"

[signing]
behavior = "drop"
backend = "ssh"
key = "/home/tobi/.ssh/id_rsa"

[ui]
default-command = "log"
diff-formatter = ["difft", "--color=always", "--width", "$width", "$left", "$right"]
editor = "hx"

[remotes.origin]
auto-track-created-bookmarks = "*"

[git]
sign-on-push = true
private-commits = 'description(glob-i:"private:*")'
